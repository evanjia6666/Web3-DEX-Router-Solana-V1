[workspace]
resolver="2"
members = [
    "programs/*"
]

[profile.release]
overflow-checks = true
# "z" (size) over "s": 654,824 -> 598,104 B (-8.7%) on the deploy artifact.
# Deploy needs a rent-exempt buffer of (size+128)*6960 lamports, so -56.7 KB
# is -0.396 SOL of buffer rent. Trade-off: size-optimised codegen can cost a
# few % more compute units — re-check CU on devnet before mainnet.
opt-level = "z"
lto = "fat"
codegen-units = 1
[profile.release.build-override]
opt-level = 3
incremental = false
codegen-units = 1
